  html { scroll-behavior: smooth; scroll-padding-top: 5.5rem; }
  html, body { margin: 0; padding: 0; }

  .doc h4 { font-size: 16px; font-weight: 600; margin: 1.5rem 0 0.5rem; }
  .doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc .table-wrap, .doc figure { margin: 0 0 1rem; }
  .doc ul { list-style: disc; padding-left: 1.4rem; }
  .doc ol { list-style: decimal; padding-left: 1.4rem; }
  .doc li { margin: 0.25rem 0; }

  .doc a { color: #0B7F78; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .doc a:hover { color: #096A64; }
  .doc strong { font-weight: 700; }
  .doc hr { border: 0; border-top: 1px solid #d8e3fb; margin: 2.5rem 0; }
  .doc blockquote { padding: 0.75rem 1.1rem; border-left: 4px solid #0B7F78; background: #F0F6FF; border-radius: 0 1rem 1rem 0; color: #3d4a42; font-size: 14px; line-height: 23px; }
  .doc blockquote > :last-child { margin-bottom: 0; }
  .doc code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.88em; background: #e7eeff; padding: 0.1em 0.35em; border-radius: 0.35rem; }
  .doc pre { background: #F0F6FF; padding: 1rem 1.1rem; border-radius: 1rem; overflow-x: auto; font-size: 13px; line-height: 20px; }
  .doc pre code { background: none; padding: 0; font-size: inherit; }
  .doc img { max-width: 100%; height: auto; border-radius: 1rem; border: 1px solid #E8EFF7; }
  .doc .table-wrap { overflow-x: auto; border: 1px solid #e7eeff; border-radius: 1rem; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 22px; }
  .doc th { background: #F0F6FF; color: #3d4a42; font-weight: 600; text-align: left; white-space: nowrap; }
  .doc th, .doc td { padding: 0.6rem 0.9rem; vertical-align: top; min-width: 5.5rem; }
  .doc tr + tr td, .doc thead + tbody tr td { border-top: 1px solid #e7eeff; }

<main class="w-full pt-[83px]">

        <a id="doc-raw" class="hidden ml-auto text-outline hover:text-on-surface underline underline-offset-2" href="#">원문(.md) 보기</a>
      </div>
      <article id="doc" class="doc bg-surface-container-lowest rounded-3xl p-6 md:p-10 shadow-sm border border-[#E8EFF7]">

  </div>
</footer>

<script>
(function () {
  // 뷰어가 열 수 있는 문서: 레포의 PRD/, report/ 아래 .md 만
  var ALLOWED = /^(PRD|report)\/[^\\:?#]+\.md$/i;
  var article = document.getElementById('doc');
  var siteRoot = new URL('./', location.href);   // doc.html 이 있는 레포 루트

  function isAllowed(path) {
    return typeof path === 'string' && ALLOWED.test(path) &&
      path.split('/').every(function (seg) { return seg !== '' && seg !== '.' && seg !== '..'; });
  }

  function showError(title, detail) {
    document.title = '문서를 열 수 없음 | 별일없지';
    article.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = title;
    var p = document.createElement('p'); p.textContent = detail;
    var a = document.createElement('a'); a.href = 'index.html'; a.textContent = '홈으로 돌아가기';
    article.append(h, p, a);
  }

  // 사이트 루트 기준 상대 경로 (루트 밖이면 null)
  function siteRelative(url) {
    if (url.origin !== siteRoot.origin || url.pathname.indexOf(siteRoot.pathname) !== 0) return null;
    return decodeURIComponent(url.pathname.slice(siteRoot.pathname.length));
  }

  // GitHub 방식에 가까운 제목 id
  function slugify(text, used) {
    var base = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-') || 'section';
    var id = base, n = 1;
    while (used[id]) id = base + '-' + n++;
    used[id] = true;
    return id;
  }

  // 문서 안 상대 경로를 .md 파일 위치 기준으로 다시 계산
  function rewrite(root, mdUrl) {
    root.querySelectorAll('img[src]').forEach(function (img) {
      var abs = new URL(img.getAttribute('src'), mdUrl);
      var rel = siteRelative(abs);
      img.setAttribute('src', rel !== null ? rel : abs.href);
      img.setAttribute('loading', 'lazy');
    });
    root.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (href.charAt(0) === '#') return;                       // 문서 안 이동
      var abs = new URL(href, mdUrl);
      if (abs.protocol !== 'http:' && abs.protocol !== 'https:') return;  // mailto 등
      var rel = siteRelative(abs);
      if (rel === null) {                                       // 외부 링크
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
        return;
      }
      if (isAllowed(rel)) {                                     // 다른 문서 → 뷰어 안에서
        a.setAttribute('href', 'doc.html?file=' + encodeURIComponent(rel).replace(/%2F/g, '/') + abs.hash);
      } else {                                                  // docx 등 → 파일 그대로
        a.setAttribute('href', rel + abs.hash);
        if (!/\.html?$/i.test(rel)) a.setAttribute('download', '');
      }
    });
  }

  var file = new URLSearchParams(location.search).get('file');
  if (!file) {
    showError('문서를 지정하지 않았습니다', '주소에 ?file=PRD/PRD.md 처럼 열 문서를 지정해 주세요.');
    return;
  }
  if (!isAllowed(file)) {
    showError('열 수 없는 문서입니다', '이 뷰어는 PRD/, report/ 폴더 아래의 .md 파일만 열 수 있습니다. (요청: ' + file + ')');
    return;
  }
  if (!window.marked || !window.DOMPurify) {
    showError('문서 뷰어를 불러오지 못했습니다', '마크다운 변환 스크립트(CDN)를 불러오지 못했습니다. 네트워크 상태를 확인한 뒤 새로고침해 주세요.');
    return;
  }

  var mdUrl = new URL(file, siteRoot);
  document.getElementById('doc-path').textContent = file;
  var raw = document.getElementById('doc-raw');
  raw.href = file; raw.classList.remove('hidden');

  fetch(mdUrl.href, { cache: 'no-cache' })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status === 404 ? '파일이 없습니다 (404).' : '서버 응답 ' + res.status);
      return res.text();
    })
    .then(function (md) {
      var html = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
      var tpl = document.createElement('template');
      tpl.innerHTML = html;
      var frag = tpl.content;

      rewrite(frag, mdUrl);

      var used = {};
      frag.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
        if (!h.id) h.id = slugify(h.textContent, used);
      });
      frag.querySelectorAll('table').forEach(function (t) {
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      });

      var h1 = frag.querySelector('h1');
      document.title = (h1 ? h1.textContent.trim() : file) + ' | 별일없지';

      article.innerHTML = '';
      article.appendChild(frag);
      if (location.hash) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    })
    .catch(function (err) {
      showError('문서를 불러오지 못했습니다', file + ' — ' + err.message);
    });
})();
</script>
